name: Publish Deep Mine test-install release

on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/publish-test-install.yml ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Build package
        shell: pwsh
        run: |
          dotnet restore .\ShouldIDeepMine\ShouldIDeepMine.csproj
          dotnet build .\ShouldIDeepMine\ShouldIDeepMine.csproj --configuration Release --no-restore
          $package = Get-ChildItem -Path ".\ShouldIDeepMine\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force

      - name: Publish v0.1.0 test-install release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0"
          $asset = "$env:RUNNER_TEMP\latest.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$asset#latest.zip" --clobber
          } else {
            gh release create $tag "$asset#latest.zip" --target main --title "Should I Deep Mine? v0.1.0" --notes "Experimental companion test-install release for user-started native Market Board deep scans and Should I? IPC snapshots."
          }

      - name: Point custom repository manifest at v0.1.0
        shell: pwsh
        run: |
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          $manifest[0].AssemblyVersion = "0.1.0.0"
          $manifest[0].DownloadLinkInstall = "https://github.com/JustPixelll/ShouldIDeepMine/releases/download/v0.1.0/latest.zip"
          $manifest[0].DownloadLinkUpdate = "https://github.com/JustPixelll/ShouldIDeepMine/releases/download/v0.1.0/latest.zip"
          $lastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $changelog = "v0.1.0 experimental test-install: explicit deep-scan scopes, queue controls, local cache, and Should I? IPC integration."
          if ($manifest[0].PSObject.Properties.Name -contains "LastUpdate") {
            $manifest[0].LastUpdate = $lastUpdate
          } else {
            $manifest[0] | Add-Member -NotePropertyName LastUpdate -NotePropertyValue $lastUpdate
          }
          if ($manifest[0].PSObject.Properties.Name -contains "Changelog") {
            $manifest[0].Changelog = $changelog
          } else {
            $manifest[0] | Add-Member -NotePropertyName Changelog -NotePropertyValue $changelog
          }
          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: point plugin repository at v0.1.0"
            git push origin main
          }
